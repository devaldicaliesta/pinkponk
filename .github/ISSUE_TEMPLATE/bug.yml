name: Laporan bug
description: Laporkan masalah saat bermain PinkPonk
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Langkah
      description: Apa yang kamu lakukan sampai bug muncul?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Yang diharapkan
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Yang terjadi
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Perangkat dan browser
      placeholder: "contoh: Android 14, Chrome 141"
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Vs AI, Timing Smash, Online 1v1, 2 Pemain]
  - type: dropdown
    id: pov
    attributes:
      label: Kamera
      options: [Klasik, Orang pertama, Siaran TV, Isometrik]
  - type: dropdown
    id: theme
    attributes:
      label: Tema
      options: [Gelap, Terang]
  - type: input
    id: ping
    attributes:
      label: Ping (khusus online)
